<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="t d">
  <title id="t">quark-cli：给 agent 用的夸克网盘命令行</title>
  <desc id="d">夸克网盘的图标，旁边是一个终端窗口，运行 quark ls、quark upload 和一条失败时的结构化报错</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#10224d"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="360" rx="20" fill="url(#bg)"/>

  <!-- A disc with a round hole whose lower-right corner is filled in, in the drive's blue. -->
  <mask id="hole" maskUnits="userSpaceOnUse" x="60" y="48" width="72" height="72">
    <rect x="60" y="48" width="72" height="72" fill="#fff"/>
    <circle cx="96" cy="84" r="18" fill="#000"/>
    <rect x="101" y="84" width="14" height="14" rx="3" fill="#fff"/>
  </mask>
  <circle cx="96" cy="84" r="36" fill="#1a5cff" mask="url(#hole)" transform="translate(0 32)"/>
  <g transform="translate(0 32)" font-family="-apple-system, 'PingFang SC', 'Helvetica Neue', sans-serif">
    <text x="150" y="102" font-size="52" font-weight="700" fill="#f8fafc">quark-cli</text>
    <text x="60" y="176" font-size="28" font-weight="600" fill="#e2e8f0">给 agent 用的夸克网盘命令行</text>
    <text x="60" y="214" font-size="19" fill="#94a3b8">你只负责扫码登录，和批准有风险的操作</text>
  </g>

  <text x="60" y="296" font-family="-apple-system, 'PingFang SC', 'Helvetica Neue', sans-serif" font-size="14" fill="#64748b">非官方项目，与夸克无关</text>

  <!-- Happy path -->
  <rect x="520" y="30" width="630" height="300" rx="12" fill="#020617" stroke="#334155"/>
  <circle cx="546" cy="54" r="6" fill="#ef4444"/>
  <circle cx="568" cy="54" r="6" fill="#f59e0b"/>
  <circle cx="590" cy="54" r="6" fill="#22c55e"/>
  <g font-family="'SF Mono', Menlo, Consolas, monospace" font-size="15" xml:space="preserve">
    <text x="544" y="104" fill="#e2e8f0"><tspan fill="#22c55e">$</tspan> quark login<tspan fill="#64748b">   # 弹出小窗，扫码一次</tspan></text>
    <text x="544" y="136" fill="#e2e8f0"><tspan fill="#22c55e">$</tspan> quark mkdir /WORK --raw</text>
    <text x="544" y="158" fill="#94a3b8">/WORK</text>
    <text x="544" y="190" fill="#e2e8f0"><tspan fill="#22c55e">$</tspan> quark upload ./report.pdf /WORK --raw</text>
    <text x="544" y="212" fill="#94a3b8">/WORK/report.pdf</text>
    <text x="544" y="244" fill="#e2e8f0"><tspan fill="#22c55e">$</tspan> quark share /WORK/report.pdf --code</text>
    <text x="544" y="266" fill="#94a3b8">link: https://pan.quark.cn/s/1a2b3c4d5e6f</text>
    <text x="544" y="288" fill="#94a3b8">code: k7Qp</text>
    <text x="544" y="310" fill="#94a3b8">days: 7</text>
  </g>
</svg>
