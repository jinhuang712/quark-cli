<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="t d">
  <title id="t">quark-cli：给 agent 用的夸克网盘命令行</title>
  <desc id="d">夸克网盘的图标，旁边是一个终端窗口，运行 quark ls、quark upload 和一条失败时的结构化报错</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#10224d"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="360" rx="20" fill="url(#bg)"/>

  <!-- A disc with a round hole whose lower-right corner is filled in, in the drive's blue. -->
  <mask id="hole" maskUnits="userSpaceOnUse" x="60" y="48" width="72" height="72">
    <rect x="60" y="48" width="72" height="72" fill="#fff"/>
    <circle cx="96" cy="84" r="18" fill="#000"/>
    <rect x="101" y="84" width="14" height="14" rx="3" fill="#fff"/>
  </mask>
  <circle cx="96" cy="84" r="36" fill="#1a5cff" mask="url(#hole)" transform="translate(0 32)"/>
  <g transform="translate(0 32)" font-family="-apple-system, 'PingFang SC', 'Helvetica Neue', sans-serif">
    <text x="150" y="102" font-size="52" font-weight="700" fill="#f8fafc">quark-cli</text>
    <text x="60" y="176" font-size="28" font-weight="600" fill="#e2e8f0">给 agent 用的夸克网盘命令行</text>
    <text x="60" y="214" font-size="19" fill="#94a3b8">你只负责扫码登录，和批准有风险的操作</text>
  </g>

  <text x="60" y="296" font-family="-apple-system, 'PingFang SC', 'Helvetica Neue', sans-serif" font-size="14" fill="#64748b">非官方项目，与夸克无关</text>

  <!-- Core features -->
  <rect x="520" y="40" width="200" height="130" rx="12" fill="#0f1a33" stroke="#2a3a63"/>
  <text x="538" y="78" font-family="-apple-system, 'PingFang SC', 'Helvetica Neue', sans-serif" font-size="22" font-weight="700" fill="#f8fafc">浏览</text>
  <text x="538" y="110" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#7dd3fc">ls · search · info</text>
  <text x="538" y="140" font-family="-apple-system, 'PingFang SC', 'Helvetica Neue', sans-serif" font-size="14" fill="#94a3b8">目录、搜索、文件详情</text>
  <rect x="735" y="40" width="200" height="130" rx="12" fill="#0f1a33" stroke="#2a3a63"/>
  <text x="753" y="78" font-family="-apple-system, 'PingFang SC', 'Helvetica Neue', sans-serif" font-size="22" font-weight="700" fill="#f8fafc">整理</text>
  <text x="753" y="110" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#7dd3fc">mkdir · mv · rename · rm</text>
  <text x="753" y="140" font-family="-apple-system, 'PingFang SC', 'Helvetica Neue', sans-serif" font-size="14" fill="#94a3b8">rm 不加 --yes 只给计划</text>
  <rect x="950" y="40" width="200" height="130" rx="12" fill="#0f1a33" stroke="#2a3a63"/>
  <text x="968" y="78" font-family="-apple-system, 'PingFang SC', 'Helvetica Neue', sans-serif" font-size="22" font-weight="700" fill="#f8fafc">传输</text>
  <text x="968" y="110" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#7dd3fc">upload · download</text>
  <text x="968" y="140" font-family="-apple-system, 'PingFang SC', 'Helvetica Neue', sans-serif" font-size="14" fill="#94a3b8">上传 3 个并行，支持秒传</text>
  <rect x="520" y="190" width="200" height="130" rx="12" fill="#0f1a33" stroke="#2a3a63"/>
  <text x="538" y="228" font-family="-apple-system, 'PingFang SC', 'Helvetica Neue', sans-serif" font-size="22" font-weight="700" fill="#f8fafc">分享</text>
  <text x="538" y="260" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#7dd3fc">share · unshare · save</text>
  <text x="538" y="290" font-family="-apple-system, 'PingFang SC', 'Helvetica Neue', sans-serif" font-size="14" fill="#94a3b8">建链接、取消、转存别人的</text>
  <rect x="735" y="190" width="200" height="130" rx="12" fill="#0f1a33" stroke="#2a3a63"/>
  <text x="753" y="228" font-family="-apple-system, 'PingFang SC', 'Helvetica Neue', sans-serif" font-size="22" font-weight="700" fill="#f8fafc">只做一件事</text>
  <text x="753" y="260" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="13" fill="#7dd3fc">不自动建目录、跳过、覆盖</text>
  <text x="753" y="290" font-family="-apple-system, 'PingFang SC', 'Helvetica Neue', sans-serif" font-size="14" fill="#94a3b8">要几步就发几条命令</text>
  <rect x="950" y="190" width="200" height="130" rx="12" fill="#0f1a33" stroke="#2a3a63"/>
  <text x="968" y="228" font-family="-apple-system, 'PingFang SC', 'Helvetica Neue', sans-serif" font-size="22" font-weight="700" fill="#f8fafc">失败有下一步</text>
  <text x="968" y="260" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#7dd3fc">error · code · next</text>
  <text x="968" y="290" font-family="-apple-system, 'PingFang SC', 'Helvetica Neue', sans-serif" font-size="14" fill="#94a3b8">退出码固定，0 到 5</text>
</svg>
